[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100
# The GachaMachine's settlement paths carry more live locals than the legacy pipeline's 16-slot
# stack window allows, and via-IR also buys ~15% smaller bytecode, which matters for the 24KB limit.
via_ir = true
bytecode_hash = "none"
ffi = false
fs_permissions = [
  {access = "read", path = "./script"},
  {access = "read-write", path = "./deployments"},
]
build_info = true
extra_output = ["storageLayout"]
gas_reports = ["GachaMachine", "ReserveVault", "Vault", "Marketplace", "CollectibleNFT"]

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

# CI profile: heavier fuzzing, deeper invariants. `FOUNDRY_PROFILE=ci forge test`
[profile.ci]
optimizer_runs = 100
verbosity = 2

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 1000
depth = 128

# `via_ir` profile is used for the size-check job; identical semantics, smaller bytecode.
[profile.size]
via_ir = true
optimizer_runs = 100

[lint]
# Every `block.timestamp` comparison in this suite guards a multi-minute or multi-day window
# (buyback window, reveal timeout, signature deadline, transfer holdback). A validator's few-second
# timestamp latitude cannot move any of them, and no randomness or pricing is derived from time.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
bnb = "${BNB_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
base = {key = "${ETHERSCAN_API_KEY}", chain = 8453}
polygon = {key = "${ETHERSCAN_API_KEY}", chain = 137}
arbitrum = {key = "${ETHERSCAN_API_KEY}", chain = 42161}
bnb = {key = "${ETHERSCAN_API_KEY}", chain = 56}
ethereum = {key = "${ETHERSCAN_API_KEY}", chain = 1}
