# =================================================================================================
# Render blueprint — public testnet deployment (Option A: NODE_ENV=development + local signer keys).
#
# See docs/RENDER-DEPLOY.md for the walkthrough, and docs/TESTNET-PUBLIC-DEPLOY.md for why the
# configuration below looks the way it does.
#
# Two services and a database, all on free plans — the whole stack costs nothing:
#
#   collector-web      Next.js frontend, and the same-origin proxy for /api/*
#   collector-api      Fastify API, plus the indexer and reconciler in-process
#   collector-db       Postgres
#
# Deliberately absent: a Key Value instance and a separate worker service. The workspace's one free
# Key Value slot is already taken, and Render has no free worker tier — either would have failed the
# apply or cost money. Both omissions are annotated where they used to live, with how to restore
# them. The single-instance constraint that makes in-process workers safe is documented on
# RUN_WORKERS_IN_PROCESS; read it before moving collector-api to a paid plan.
#
# Values marked `sync: false` are NOT in this file by design — set them in the Render dashboard
# during the apply. Four of them are hot-wallet private keys.
# =================================================================================================

envVarGroups:
  # Shared by the API and the workers. Both processes must agree on every one of these — a worker
  # signing with a different oracle key than the API quotes with produces signatures the contracts
  # reject, and a mismatched SESSION_SECRET invalidates sessions at random.
  - name: collector-backend
    envVars:
      # See docs/TESTNET-PUBLIC-DEPLOY.md §4: NODE_ENV=production refuses to boot without AWS KMS,
      # all four KMS key ids, Redis and a MoonPay webhook secret. The session cookie's Secure flag
      # keys off PUBLIC_ORIGIN being https, NOT off NODE_ENV, so this does not ship a plaintext
      # cookie. Moving to KMS later means flipping this and SIGNER_MODE together.
      - key: NODE_ENV
        value: development
      - key: LOG_LEVEL
        value: info

      - key: SESSION_SECRET
        generateValue: true # 32+ bytes, generated once, shared by both services via this group
      - key: SESSION_TTL_SECONDS
        value: 3600

      # --- signing ---------------------------------------------------------------------------
      # These four keys hold TRUSTED_RELAYER / ORACLE / BUYBACK and PAUSE_ADMIN. Whoever holds the
      # relayer key can rip and pause. Generate fresh ones for this deployment; never reuse a devnet
      # key — the ones in backend/.env.example are published in the repo.
      - key: SIGNER_MODE
        value: local
      - key: ORACLE_PRIVATE_KEY
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: BUYBACK_PRIVATE_KEY
        sync: false
      - key: POOL_AUTHOR_PRIVATE_KEY
        sync: false

      # --- chains ----------------------------------------------------------------------------
      # Three chains, matching be.env. All three are deployed, and TRUSTED_RELAYER / TRUSTED_ORACLE /
      # TRUSTED_BUYBACK are granted to the same three addresses on each — verified on-chain, so the
      # one set of signer keys works everywhere. Dropping ethereum_sepolia is a safe one-line edit if
      # the indexer proves too costly on free-tier RPC.
      - key: ENABLED_CHAINS
        value: base_sepolia,bnb_testnet,ethereum_sepolia
      # Public Sepolia endpoints are rate limited hard enough to stall the indexer. Use Alchemy or
      # Infura, and a DIFFERENT key from the frontend's — the frontend's ships in the browser
      # bundle, and a shared key lets a scraper exhaust the quota the indexer depends on.
      - key: BASE_SEPOLIA_RPC_URL
        sync: false
      - key: BNB_TESTNET_RPC_URL
        sync: false
      - key: ETHEREUM_SEPOLIA_RPC_URL
        sync: false

      # --- compliance --------------------------------------------------------------------------
      # age_only, not off: `off` is refused on any mainnet chain regardless of NODE_ENV, needs no
      # KYC vendor, and disables sell-back — removing the cash-out leg, which is the right posture
      # for a publicly reachable random-outcome purchase. The jurisdiction list is a placeholder
      # that counsel must set per market before any real launch.
      - key: COMPLIANCE_MODE
        value: age_only
      - key: GACHA_BLOCKED_JURISDICTIONS
        value: US-WA,US-HI,BE,NL,AU
      - key: MIN_AGE_YEARS
        value: 18

      # --- ops ---------------------------------------------------------------------------------
      - key: INDEXER_INTERVAL_MS
        value: 12000
      - key: RECONCILER_INTERVAL_MS
        value: 30000
      # When the chain and the DB disagree about reserve state, buyback auto-pauses.
      - key: RECONCILER_AUTOPAUSE
        value: true
      # Slack/Discord webhook. Relayer gas hitting zero makes every rip hang with no user-facing
      # error, so this is the difference between noticing in minutes and noticing from a bug report.
      - key: ALERT_WEBHOOK_URL
        sync: false

databases:
  - name: collector-db
    databaseName: collector
    user: collector
    plan: free # free Postgres expires 30 days after creation — upgrade before it does
    region: oregon

services:
  # -----------------------------------------------------------------------------------------------
  # NO REDIS, deliberately.
  #
  # Render allows one free Key Value instance per workspace and `soleai-redis` already holds that
  # slot (suspended still counts), so a `plan: free` keyvalue here cannot be created and the whole
  # apply halts on it — which is what stopped the first attempt after collector-db.
  #
  # Leaving REDIS_URL unset is a supported path, not a hack: config.ts defaults it to '' and
  # index.ts falls back to an in-process rate limiter, logging a warning. The guard that refuses
  # this only fires when NODE_ENV=production, and this deployment runs development. The limiter is
  # then per-instance and resets on deploy — which costs nothing here, because the free plan runs
  # exactly one instance anyway.
  #
  # To add it back later: recreate the keyvalue service on `plan: starter` and restore the REDIS_URL
  # fromService block on collector-api.
  # -----------------------------------------------------------------------------------------------

  # -----------------------------------------------------------------------------------------------
  # API — and, on this plan, the workers too. See RUN_WORKERS_IN_PROCESS below.
  # -----------------------------------------------------------------------------------------------
  - type: web
    name: collector-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # `--include=dev` is not optional. Render defaults NODE_ENV=production on the node runtime, and
    # npm's `omit` defaults to `dev` under it — which would drop typescript and fail `tsc`. The env
    # group happens to set NODE_ENV=development, so this is belt-and-braces today, but the day
    # someone flips it to production for KMS mode the build must not break with it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - fromGroup: collector-backend
      - key: NODE_VERSION
        value: 22
      # Pinned so the private-network address is a stable host:port. Render would otherwise assign it.
      - key: PORT
        value: 8080
      # Given a value rather than `sync: false` so the API boots on the FIRST apply. config.ts
      # requires this to be a valid URL, so leaving it blank meant the first deploy always failed
      # and needed a manual round trip once Render had assigned hostnames.
      #
      # A wrong hostname here is harmless under the same-origin proxy, which is why a literal is
      # safe. It feeds exactly two things:
      #   - the session cookie's Secure flag, which is `PUBLIC_ORIGIN.startsWith('https://')`
      #     (services/auth.ts:108) — satisfied by any https value;
      #   - the CORS allowlist, which the browser never exercises, because it calls collector-web's
      #     own origin and Next proxies onward server-side. Same-origin requests are not CORS-checked.
      # Correct it to the real hostname anyway once you know it — relying on that is not a plan.
      - key: PUBLIC_ORIGIN
        value: https://collector-web.onrender.com
      # Runs the indexer and reconciler inside this process (honoured at src/index.ts:150), instead
      # of the separate `worker` service Render has no free instance type for.
      #
      # Safe ONLY while this stays at one instance — two indexers race, double-index and
      # double-settle. The free plan cannot scale past one, so the constraint holds by construction;
      # if you ever move this service to a paid plan, split the workers back out FIRST.
      #
      # The real cost is that a free web service sleeps after ~15 minutes idle, and a sleeping
      # indexer is not indexing. It catches up on the next request rather than losing anything.
      - key: RUN_WORKERS_IN_PROCESS
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: collector-db
          property: connectionString

  # -----------------------------------------------------------------------------------------------
  # NO SEPARATE WORKER SERVICE, deliberately.
  #
  # Render has no free instance type for background workers, so this was the one paid resource in
  # the stack and one more thing that could fail to create. The indexer and reconciler now run
  # inside collector-api via RUN_WORKERS_IN_PROCESS — see the note on that variable above for the
  # single-instance constraint that makes it safe.
  #
  # To split them back out: recreate a `type: worker` service on `plan: starter` with
  # `startCommand: node dist/workers/index.js`, and drop RUN_WORKERS_IN_PROCESS from the API.
  # -----------------------------------------------------------------------------------------------

  # -----------------------------------------------------------------------------------------------
  # Frontend. Also the API's public face: next.config.mjs rewrites /api/* to the API over the
  # private network, so the browser only ever sees one origin and the SameSite=Lax session cookie
  # stays first-party. See the comment in next.config.mjs for why that matters on onrender.com.
  # -----------------------------------------------------------------------------------------------
  - type: web
    name: collector-web
    runtime: node
    plan: free
    region: oregon
    # `--include=dev` is load-bearing here, not defensive: tailwindcss and @tailwindcss/postcss are
    # devDependencies, postcss.config.mjs needs them, and Render's default NODE_ENV=production makes
    # plain `npm ci` omit them. `next build` then dies on "Cannot find module '@tailwindcss/postcss'".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      # Relative, so every call goes to this app's own origin and hits the rewrite above.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      # Needed at BUILD time, not just at boot: next.config.mjs resolves rewrites() during
      # `next build` and bakes the destination into .next/routes-manifest.json. If this is empty
      # when the build runs, the deployed frontend has no /api route at all and every call 404s —
      # so next.config.mjs now fails the build loudly rather than shipping that. If it ever fires,
      # the fix is a redeploy of collector-web once collector-api exists.
      # `host:port` with no scheme is fine — next.config.mjs normalises it. If private networking is
      # unavailable on your plan, set this to the API's public https URL instead; the cookie fix
      # works either way.
      - key: BACKEND_INTERNAL_URL
        fromService:
          name: collector-api
          type: web
          property: hostport
      - key: NEXT_PUBLIC_DEFAULT_CHAIN_ID
        value: 84532 # Base Sepolia
      # Reown authorises on project id PLUS origin. Add this service's URL to the project's allowed
      # domains at dashboard.reown.com BEFORE deploying, or the RPC proxy answers 403 and it surfaces
      # as a failed contract read mid-checkout.
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        sync: false
      # Separate Alchemy key from the backend's — these ship in the browser bundle. Add a domain
      # allowlist to this key in the Alchemy dashboard.
      - key: NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL
        sync: false
      - key: NEXT_PUBLIC_BNB_TESTNET_RPC_URL
        sync: false
      - key: NEXT_PUBLIC_ETHEREUM_SEPOLIA_RPC_URL
        sync: false
      # Deliberately NOT set: NEXT_PUBLIC_ANVIL_RPC_URL adds the local devnet to the wallet's
      # network list.
